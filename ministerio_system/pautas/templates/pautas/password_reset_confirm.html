<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha</title>
    <!-- Se estiveres a usar Bootstrap, podes manter o link ou apagar se não precisares -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h2 class="mb-4">Definir Nova Senha</h2>
                    
                    {% if validlink %}
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-primary w-100 mt-3">Salvar nova senha</button>
                        </form>
                    {% else %}
                        <div class="alert alert-danger" role="alert">
                            O link de redefinição de palavra-passe é inválido, possivelmente porque já foi utilizado ou expirou. Por favor, solicita um novo pedido.
                        </div>
                        <a href="{% url 'pautas:password_reset' %}" class="btn btn-secondary w-100">Solicitar novo link</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>

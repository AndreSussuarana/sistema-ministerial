{% extends 'pautas/base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 400px;">
    <div class="card shadow p-4">
        <h3 class="mb-3 text-center">Recuperar Senha</h3>
        <p class="text-muted small">Insira o seu e-mail para receber as instruções de redefinição da senha.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Enviar e-mail de recuperação</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="small text-decoration-none">Voltar ao Login</a>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'pautas/base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Adicionar nova Pauta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4">
                    <h2 class="mb-4">Adicionar nova Pauta</h2>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p}}
                        <button type="submit" class="btn btn-primary w-100 mt-3">Salvar Pauta</button>
                    </form>
                    <a href="{% url 'pautas:listar_pautas' %}" class="btn btn-link mt-3 text-center">Voltar à lista</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
{% endblock %}
